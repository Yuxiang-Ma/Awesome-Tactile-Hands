name: Check catalog
# claude/nightly is checked by scripts/nightly_guard.py before each commit and rebuilt at publish time, so it is not checked here
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_readme.py --check
