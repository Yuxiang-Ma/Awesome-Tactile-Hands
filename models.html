<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tactile Hand Models</title>
<meta name="description" content="Models trained or evaluated on touch recorded across a hand, with the tactile datasets each one uses and whether its code and weights are released.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a6c73'/%3E%3Cg fill='%23fff'%3E%3Crect x='9' y='5' width='3.2' height='12' rx='1.6'/%3E%3Crect x='13.4' y='3.5' width='3.2' height='13' rx='1.6'/%3E%3Crect x='17.8' y='4.5' width='3.2' height='12' rx='1.6'/%3E%3Crect x='22.2' y='7' width='3.2' height='10' rx='1.6'/%3E%3Crect x='8' y='15' width='17.6' height='12' rx='3'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/site.css">
<style>
/* models: one row per model (what it is | the data it learned from | what is released) */
.mlist{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.mrow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) 200px;gap:6px 22px;padding:14px 16px;border-top:1px solid var(--line2);cursor:pointer}
.mrow:first-child{border-top:0}
.mrow:hover{background:var(--bg)}
.mrow .desc{-webkit-line-clamp:2}
.mcol{display:flex;flex-direction:column;gap:6px;min-width:0}
.mlbl{font-size:10.5px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.own{font-size:12.5px;color:var(--ink2);line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rel{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0;font-size:13px;align-items:center}
.rel dt{color:var(--muted);font-size:12px}
.rel dd{margin:0;display:flex;align-items:center;gap:5px;font-weight:600}
.rel a{text-decoration:none}.rel a:hover{text-decoration:underline}
.st{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.st-released{color:var(--ok)}.st-announced{color:var(--warn)}.st-not_released{color:var(--muted);font-weight:500}
.chk{font-size:11.5px;color:var(--muted)}
.tag.kind{background:var(--pre);font-weight:600;color:var(--ink2)}
.kv .st-released,.kv .st-announced,.kv .st-not_released{display:inline-flex;align-items:center;gap:5px;font-weight:600}
@media (max-width:1100px){.mrow{grid-template-columns:minmax(0,1fr) 190px}.mrow .muses{grid-column:1/-1;grid-row:2}}
@media (max-width:560px){.mrow{grid-template-columns:minmax(0,1fr)}.mrow .muses{grid-row:auto}}
</style>
</head>
<body>
<header class="top">
  <h1>Taxel Atlas</h1><span class="sum" id="sum"></span>
  <nav>
    <a href="./"><svg viewBox="0 0 24 24" class="ln"><path d="M4 5h16M4 12h16M4 19h16"/></svg><span>Datasets</span></a>
    <a href="models.html" aria-current="page"><svg viewBox="0 0 24 24" class="ln"><circle cx="5" cy="6.5" r="2.2"/><circle cx="5" cy="17.5" r="2.2"/><circle cx="19" cy="12" r="2.2"/><path d="M7.1 7.3 16.9 11.2M7.1 16.7l9.8-3.9M5 8.7v6.6"/></svg><span>Models</span></a>
    <a href="hardware.html"><svg viewBox="0 0 24 24" class="ln"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></svg><span>Hardware</span></a>
    <a href="pose.html"><svg viewBox="0 0 24 24" class="ln"><path d="M12 21v-6M12 15 6 11.5 4.5 8M12 15V4.5M12 15l3.5-9M12 15l5.5-5.5"/><circle cx="12" cy="15" r="1.4"/></svg><span>Hand pose</span></a>
    <a href="viewer/" class="pri"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><span>Data viewer</span></a>
    <a id="contrib" href="#"><svg viewBox="0 0 24 24"><path d="M11 5h2v14h-2zM5 11h14v2H5z"/></svg><span>Suggest a model</span></a>
    <a id="gh" href="#" aria-label="GitHub repository"><svg viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg><span>GitHub</span></a>
  </nav>
</header>
<div class="app">
  <aside class="facets" id="facets" aria-label="Filters"></aside>
  <main class="main">
    <div class="bar">
      <button class="filtbtn" id="filtbtn" aria-controls="facets">Filters</button>
      <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search model, author, dataset, hand…" aria-label="Search"></label>
      <div class="seg" role="group" aria-label="View"><button data-view="list" aria-pressed="true">List</button><button data-view="table" aria-pressed="false">Compare</button></div>
      <label class="sort">Sort <select id="sort"><option value="kind">Kind</option><option value="year">Newest</option><option value="released">Released first</option><option value="uses">Datasets used</option><option value="name">Name</option></select></label>
      <span class="count" id="count" aria-live="polite"></span>
    </div>
    <div class="chips" id="chips"></div>
    <div id="out"></div>
  </main>
</div>
<footer>Release status is as the authors' pages and repositories show it on the date each model was last checked. <span id="upd"></span></footer>
<dialog id="dlg" aria-labelledby="dlgTitle"></dialog>
<script src="assets/common.js"></script>
<script src="assets/models.js"></script>
</body>
</html>
