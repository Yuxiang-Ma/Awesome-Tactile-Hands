<div class="app">
  <aside class="facets" id="facets" aria-label="Filters"></aside>
  <main class="main">
    <div class="bar">
      <button class="filtbtn" id="filtbtn" aria-controls="facets">Filters</button>
      <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search name, author, hand, task…" aria-label="Search"></label>
      <div class="seg" role="group" aria-label="View"><button data-view="cards" aria-pressed="true">Cards</button><button data-view="table" aria-pressed="false">Compare</button><button data-view="chart" aria-pressed="false">Chart</button></div>
      <label class="sort">Sort <select id="sort"><option value="rank">Rank</option><option value="year">Newest</option><option value="taxels">Taxels per hand</option><option value="hours">Hours</option><option value="tasks">Tasks</option><option value="name">Name</option></select></label>
      <span class="count" id="count" aria-live="polite"></span>
    </div>
    <div class="chips" id="chips"></div>
    <div id="out"></div>
  </main>
</div>
<footer>Compiled from public papers, project pages and dataset cards. Numbers are as the authors report them; fields we could not confirm are marked. <span id="upd"></span></footer>
<dialog id="dlg" aria-labelledby="dlgTitle"></dialog>
